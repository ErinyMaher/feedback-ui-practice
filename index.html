<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback User Interface</title>

    <!-- css -->
     <link rel="stylesheet" href="style.css">

     <!-- fontawsome -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <section class="feedback-card">
        <h2>How was you experience?</h2>
        <div class="ratings">

        <div class="rating" id="unhappy">
            <i class="fa-solid fa-face-frown"></i>
            <span id="label">Unhappy</span>
        </div>

        <div class="rating" id="neutral">
            <i class="fa-solid fa-face-meh"></i>
            <span id="label">Neutral</span>
        </div>

        <div class="rating" id="satisfied">
            <i class="fa-solid fa-face-smile"></i>
            <span id="label">Satisfied</span>
        </div>
    </div>
        <button id="reviewBtn">Send Review</button>
        
    </section>
    <script src="script.js"></script>
</body>
</html>
